<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Buscador de cartas Pokemon</title>
    <link rel="stylesheet" href="Frontend/CSS/Index.css">
</head>

<body>

    <h1>Buscador de cartas Pokémon</h1>

    <input type="text" id="nombre" placeholder="Ejemplo: Pikachu">
    <button type="button" onclick="buscarCarta()">Buscar</button>

    <div id="resultado"></div>

    <script>
        async function buscarCarta() {

            const nombre = document.getElementById("nombre").value.trim();
            const resultado = document.getElementById("resultado");

            if (nombre === "") {
                resultado.innerHTML = "<p>Escribe el nombre de una carta.</p>";
                return;
            }

            resultado.innerHTML = "<p>Buscando...</p>";

            try {

                const consulta = encodeURIComponent(`name:"${nombre}"`);

                const url =
                    "https://api.pokemontcg.io/v2/cards?q=" +
                    consulta +
                    "&pageSize=20";

                const respuesta = await fetch(url);

                if (!respuesta.ok) {
                    throw new Error("Error al consultar la API");
                }

                const datos = await respuesta.json();

                if (datos.data.length === 0) {
                    resultado.innerHTML = "<p>No se ha encontrado la carta.</p>";
                    return;
                }

                let html = "";

                datos.data.forEach(carta => {

                    html += `
                        <div class="carta">
                            <h2>${carta.name}</h2>
                            
                            <img src="${carta.images.small}" 
                                 alt="${carta.name}">
                            
                            <p><strong>Colección:</strong> ${carta.set.name}</p>
                            
                            <p><strong>Fecha:</strong> ${carta.set.releaseDate}</p>
                            
                            <p><strong>Número:</strong> ${carta.number}</p>
                            
                            <p><strong>Rareza:</strong> ${carta.rarity || "No disponible"}</p>
                            
                        </div>
                    `;
                });

                resultado.innerHTML = html;

            } catch (error) {

                resultado.innerHTML =
                    "<p>Error: no se pudo realizar la búsqueda.</p>";

                console.log(error);
            }
        }
    </script>

</body>
</html>
