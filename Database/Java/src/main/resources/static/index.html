<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CardTradeDB</title><link rel="stylesheet" href="styles.css"></head><body>
<header><h1>CardTradeDB</h1><p>Prueba sencilla de comunicación entre el frontend, Java y MySQL.</p></header><main>
<section><h2>Crear usuario</h2><form id="usuarioForm"><input name="usuario" placeholder="Usuario" maxlength="16" required><input name="email" type="email" placeholder="Correo" required><input name="telefono" placeholder="Teléfono"><input name="password" type="password" placeholder="Contraseña (mínimo 8)" minlength="8" required><select name="rol"><option>CLIENTE</option><option>ADMINISTRADOR</option></select><button>Guardar usuario</button></form></section>
<section><h2>Crear producto</h2><form id="productoForm"><input name="cartaExternaId" placeholder="ID externo, por ejemplo base1-4" required><input name="idioma" value="es" required><select name="estadoCarta"><option>NUEVA</option><option>EXCELENTE</option><option>BUENA</option><option>JUGADA</option><option>DETERIORADA</option></select><select name="acabado"><option>NORMAL</option><option>HOLO</option><option>REVERSE_HOLO</option></select><input name="precio" type="number" min="0" step="0.01" placeholder="Precio" required><input name="stock" type="number" min="0" placeholder="Stock" required><button>Guardar producto</button></form></section>
<section><h2>Exportación</h2><a class="button" href="/api/exportacion/inserts">Descargar inserts.sql actual</a><pre id="resultado">Esperando una operación...</pre></section>
</main><script src="app.js"></script></body></html>
